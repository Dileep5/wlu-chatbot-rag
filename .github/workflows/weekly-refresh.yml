name: Weekly Data Refresh

# Runs the existing ingestion pipeline (crawler -> scrape -> clean ->
# chunk -> structured DB rebuild -> vector DB rebuild) via
# src/refresh_pipeline.py and commits the refreshed data/*.db,
# data/corpus_metadata.json, outputs/*.csv, and urls.txt back to main.
# Does not touch retrieval, ranking, prompting, renderer, or evaluation
# code.
on:
  schedule:
    # Every Sunday at 06:00 UTC.
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ingestion dependencies
        run: pip install -r requirements-ingestion.txt

      - name: Run refresh pipeline
        id: refresh
        run: python3 src/refresh_pipeline.py

      - name: Upload refresh log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log-${{ github.run_id }}
          path: logs/
          retention-days: 90

      - name: Commit and push refreshed data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.db data/corpus_metadata.json outputs/*.csv urls.txt
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Weekly data refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
